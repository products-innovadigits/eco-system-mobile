name: core_system
description: Shared core utilities and components for eco_system.
version: 1.0.0

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Provider registrations have been removed from core_system (moved to SystemModule pattern).
  
  # Network & HTTP
  dio: ^5.8.0+1
  connectivity_plus: ^7.0.0
  internet_connection_checker_plus: ^2.5.2
  
  # State Management
  flutter_bloc: ^9.0.0
  rxdart: ^0.28.0
  
  # Storage & Caching
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  hive_flutter: ^1.1.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.3.1
  
  # Localization
  easy_localization: ^3.0.2
  intl: ^0.20.2
  
  # UI Components
  fluttertoast: ^8.2.12
  readmore: ^3.0.0
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.1
  flutter_staggered_animations: ^1.1.1
  flutter_svg: ^2.0.17
  
  # Permissions & System
  permission_handler: ^12.0.0+1
  url_launcher: ^6.3.1
  path: ^1.9.0
  
  # Firebase
  firebase_messaging: ^15.2.1
  firebase_analytics: ^11.4.1
  firebase_core: ^3.10.1
  flutter_local_notifications: ^19.2.1
  
  # Media & Files
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  flutter_image_compress: ^2.4.0
  
  # UI Components
  modal_bottom_sheet: ^3.0.0-pre
  pin_code_fields: ^8.0.1
  
  # Configuration
  flutter_dotenv: ^5.2.1

  # Responsive
  responsive_builder: ^0.7.1
  flutter_screenutil: ^5.9.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
