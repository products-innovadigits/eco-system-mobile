name: project_management
description: Nawah Project Management module.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  core_system:
    path: ../core_system

  fl_chart: ^0.71.0
  syncfusion_flutter_charts: ^28.2.6
  url_launcher: ^6.2.1
  intl: ^0.20.2
  html: ^0.15.6
  get_it: ^8.0.3
  # M6-B0 spike only: real on-device validation is opt-in and not registered
  # in production DI. Newer flutter_gemma lines require a newer local SDK; this
  # pin resolves with Flutter 3.38 / Dart 3.10.1.
  flutter_gemma: 0.12.6


dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  dio: any

flutter:
  assets:
    - assets/ai/metadata.sample.json
    - assets/ai/prompts/system_instruction.txt
    - assets/ai/schema/nawah_compact_schema_no_terms.slim.v1.txt
