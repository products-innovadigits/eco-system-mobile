name: eco_system
description: A new Flutter application.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  core_system:
    path: systems/core_system
  ats_system:
    path: systems/ats_system
  strategy_system:
    path: systems/strategy_system
  project_management:
    path: systems/project_management
  pms_system:
    path: systems/pms_system

  flutter_localizations:
    sdk: flutter
  hydrated_bloc: ^10.0.0
  dio: ^5.9.1
  pin_code_text_field: ^1.8.0
  scroll_to_index: ^3.0.1
  font_awesome_flutter: ^10.8.0
  flutter_launcher_icons: ^0.14.3
  animations: ^2.0.11
  smooth_page_indicator: ^1.2.0+3
  app_settings: ^6.1.1
  share_plus: ^10.0.2
#  google_maps_flutter: ^2.10.0
  geolocator: ^14.0.1
#  flutter_native_splash: ^2.4.4
  flutter_animate: ^4.5.2
#  syncfusion_flutter_charts: ^28.2.6
  flutter_debouncer: ^2.0.0
  modal_bottom_sheet: ^3.0.0-pre
  dotted_line: ^3.2.3
  flutter_screenutil: ^5.9.3
  firebase_core: ^3.10.1
  envied: ^1.3.1
  path_provider: ^2.1.5
#  liquid_glass_renderer: ^0.1.1-dev.6





dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test:
  mocktail:
  build_runner:
  flutter_gen_runner:
  injectable_generator:
  envied_generator: ^1.3.1
  flutter_lints:

flutter_gen:
  output: systems/core_system/lib/core/core/
  line_length: 80
  # Optional
  integrations:
    flutter_svg: true
    rive: true
    lottie: true


#flutter_native_splash:
#  color: "#ffffff"


flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path_android: "assets/app-icon.png"
  image_path_ios: "assets/app-icon.png"
  remove_alpha_ios: true

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/svgs/
    - assets/images/
    - assets/langs/


  fonts:

    - family: en
      fonts:
        - asset: assets/fonts/ar/IBMPlexSans-Arabic-Light.ttf
          weight: 300
        - asset: assets/fonts/ar/IBMPlexSans-Arabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ar/IBMPlexSans-Arabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ar/IBMPlexSans-Arabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ar/IBMPlexSans-Arabic-Bold.ttf
          weight: 700
        - asset: assets/fonts/ar/IBMPlexSans-Arabic-Bold.ttf
          weight: 800



    - family: ar
      fonts:
        - asset: assets/fonts/ar/IBMPlexSans-Arabic-Light.ttf
          weight: 300
        - asset: assets/fonts/ar/IBMPlexSans-Arabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ar/IBMPlexSans-Arabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ar/IBMPlexSans-Arabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ar/IBMPlexSans-Arabic-Bold.ttf
          weight: 700
        - asset: assets/fonts/ar/IBMPlexSans-Arabic-Bold.ttf
          weight: 800