name: Deploy APK to Firebase

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Add new tester email (will also send to fixed list)'
        required: false
        default: 'Enter the client email...'
      systems:
        description: 'Comma-separated list of active systems (e.g. strategy,ats,pms)'
        required: true
        default: 'strategy,ats,pms'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ACTIVE_SYSTEMS: ${{ github.event.inputs.systems }}
      # Keep only the Firebase token secret (needed to upload to App Distribution)
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Install Dependencies
        run: flutter pub get

      # OPTIONAL sanity checks (won't fail the job)
      - name: Static checks
        run: |
          dart analyze || true
          flutter test --no-pub || true

      - name: Gradle props (more RAM + AndroidX)
        run: |
          {
            echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8";
            echo "android.useAndroidX=true";
            echo "android.enableJetifier=true";
          } >> android/gradle.properties
          cat android/gradle.properties

      # 🔐 Generate a temporary keystore & key.properties (NO secrets needed)
      - name: Generate CI debug-style keystore
        working-directory: android
        run: |
          mkdir -p app
          keytool -genkey -v -keystore app/keystore.jks \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > key.properties <<EOF
          storeFile=app/keystore.jks
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF
          echo "✓ Generated temp keystore & key.properties"

      - name: Build APK (verbose; capture logs)
        run: |
          set -o pipefail
          flutter clean
          flutter pub get
          flutter build apk \
            --release \
            --no-shrink \
            --dart-define=ACTIVE_SYSTEMS="${ACTIVE_SYSTEMS}" \
            -v | tee build_logs.txt

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build_logs.txt

      # Fastlane lane should pick up app/build/outputs/flutter-apk/app-release.apk
      - name: Distribute via Firebase App Distribution
        working-directory: android
        env:
          FIREBASE_TOKEN: ${{ env.FIREBASE_TOKEN }}
          ACTIVE_SYSTEMS: ${{ env.ACTIVE_SYSTEMS }}
        run: |
          fastlane android distribute_ci test_email:${{ github.event.inputs.test_email }}
