name: Deploy APK to Firebase

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Add new tester email (will also send to fixed list)'
        required: false
        default: 'Enter the client email...'

      systems:
        description: 'Comma-separated list of active systems (e.g. strategy,ats,pms)'
        required: true
        default: 'strategy,ats,pms'


      release_notes:
        description: 'Release notes for Firebase tester emails'
        required: true
        default: 'Automated CI release'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: flutter pub get

      - name: Set Gradle Heap Size
        run: echo "org.gradle.jvmargs=-Xmx4g" >> android/gradle.properties

      - name: Debug systems input
        run: echo "🚀 ACTIVE_SYSTEMS='${{ github.event.inputs.systems }}'"

      # ✅ (1) Fail fast: root .env exists + contains the key
      - name: Validate root .env and required key
        run: |
          set -e
          ENV_SOURCE="./.env"
          REQUIRED_KEY="STRATEGY_BASE_URL_DEV"

          echo "Repo root is: $(pwd)"
          echo "Checking file: $ENV_SOURCE"

          if [ ! -f "$ENV_SOURCE" ]; then
            echo "❌ .env not found at repo root: $ENV_SOURCE"
            echo "Make sure .env is committed to the repo (not gitignored)."
            exit 1
          fi

          if ! grep -q "^${REQUIRED_KEY}=" "$ENV_SOURCE"; then
            echo "❌ Key '${REQUIRED_KEY}' not found in $ENV_SOURCE"
            echo "Expected line like: ${REQUIRED_KEY}=https://..."
            exit 1
          fi

          echo "✅ .env exists and contains ${REQUIRED_KEY}"

      # ✅ Copy root .env into an asset so flutter_dotenv can load it inside APK
      - name: Prepare dotenv asset
        run: |
          set -e
          mkdir -p assets/env
          cp ./.env assets/env/.env
          echo "✅ Copied ./.env -> assets/env/.env"

      - name: Clean and get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Check Flutter doctor
        run: flutter doctor -v

      # ✅ (3) Safe flags to avoid silent failures
      - name: Build APK
        run: |
          set -e
          flutter build apk \
            --release \
            --no-shrink \
            --dart-define=ACTIVE_SYSTEMS="${{ github.event.inputs.systems }}" \
            --dart-define=DOTENV_ASSET_PATH="assets/env/.env" \
            --dart-define=ENABLE_HTTP_LOGS="true" \
            --verbose 2>&1 | tee build.log || (cat build.log && exit 1)

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1

      - name: Install Fastlane
        run: gem install fastlane

      - name: Install Bundler
        run: gem install bundler

      - name: Distribute via Firebase App Distribution
        working-directory: android
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          ACTIVE_SYSTEMS: ${{ github.event.inputs.systems }}
        run: |
          fastlane android distribute_ci \
            test_email:"${{ github.event.inputs.test_email }}" \
            release_name:"${{ github.event.inputs.release_name }}" \
            release_notes:"${{ github.event.inputs.release_notes }}"
