name: Deploy APK to Firebase

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Add new tester email (will also send to fixed list)'
        required: false
        default: 'Enter the client email...'

      # ✅ Checkboxes (booleans) instead of a comma-separated field
      enable_strategy:
        description: 'Strategy system'
        required: false
        default: true
        type: boolean

      enable_ats:
        description: 'ATS system'
        required: false
        default: true
        type: boolean

      enable_project_management:
        description: 'Project Management system'
        required: false
        default: true
        type: boolean

      enable_pms:
        description: 'PMS system'
        required: false
        default: true
        type: boolean

      release_name:
        description: 'Release name (e.g. v1.2.3-clientX)'
        required: true

      release_notes:
        description: 'Release notes for Firebase tester emails'

      enable_proxy:
        description: 'Enable proxy feature'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      # ✅ Extra speed: cache Gradle build cache + wrapper + android/.gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/build.gradle*', 'android/**/settings.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ✅ Extra speed: cache pub + dart tool
      - name: Cache Pub + Dart tool
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Root Dependencies
        run: flutter pub get

      - name: Install Core Dependencies
        working-directory: systems/core_system
        run: flutter pub get

      - name: Generate .env from secrets
        shell: bash
        env:
          DOMAIN_DEV: ${{ secrets.DOMAIN_DEV }}
          DOMAIN_PRO: ${{ secrets.DOMAIN_PRO }}
          BASE_URL_PRO: ${{ secrets.BASE_URL_PRO }}
          BASE_URL_DEV: ${{ secrets.BASE_URL_DEV }}
          STRATEGY_BASE_URL_DEV: ${{ secrets.STRATEGY_BASE_URL_DEV }}
          AUTH_BASE_URL_DEV: ${{ secrets.AUTH_BASE_URL_DEV }}
          ATS_BASE_URL_DEV: ${{ secrets.ATS_BASE_URL_DEV }}
          GOOGLE_MAPS_BASE_URL: ${{ secrets.GOOGLE_MAPS_BASE_URL }}
          SHARED_PREFERENCES_NAME: ${{ secrets.SHARED_PREFERENCES_NAME }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          set -euo pipefail

          cat > .env << EOF
          DOMAIN_DEV=${DOMAIN_DEV}
          DOMAIN_PRO=${DOMAIN_PRO}
          BASE_URL_PRO=${BASE_URL_PRO}
          BASE_URL_DEV=${BASE_URL_DEV}
          STRATEGY_BASE_URL_DEV=${STRATEGY_BASE_URL_DEV}
          AUTH_BASE_URL_DEV=${AUTH_BASE_URL_DEV}
          ATS_BASE_URL_DEV=${ATS_BASE_URL_DEV}
          GOOGLE_MAPS_BASE_URL=${GOOGLE_MAPS_BASE_URL}
          SHARED_PREFERENCES_NAME=${SHARED_PREFERENCES_NAME}
          API_KEY=${API_KEY}
          EOF

          echo "✅ .env generated from GitHub Secrets (never committed to git)"

      - name: Generate Envied Code
        working-directory: systems/core_system
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Set Gradle Heap Size
        run: |
          {
            echo "org.gradle.jvmargs=-Xmx4g"
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
            echo "org.gradle.configureondemand=true"
          } >> android/gradle.properties

      # ✅ Build ACTIVE_SYSTEMS from checkboxes (creates SYSTEMS_RAW env var)
      - name: Build ACTIVE_SYSTEMS from checkboxes
        shell: bash
        run: |
          set -euo pipefail

          systems=()

          if [ "${{ github.event.inputs.enable_strategy }}" = "true" ]; then
            systems+=("strategy")
          fi

          if [ "${{ github.event.inputs.enable_ats }}" = "true" ]; then
            systems+=("ats")
          fi

          if [ "${{ github.event.inputs.enable_project_management }}" = "true" ]; then
            systems+=("project_management")
          fi

          if [ "${{ github.event.inputs.enable_pms }}" = "true" ]; then
            systems+=("pms")
          fi

          if [ "${#systems[@]}" -eq 0 ]; then
            echo "❌ No systems selected. Enable at least one system."
            exit 1
          fi

          SYSTEMS_RAW="$(IFS=,; echo "${systems[*]}")"
          echo "✅ ACTIVE_SYSTEMS='$SYSTEMS_RAW'"

          echo "SYSTEMS_RAW=$SYSTEMS_RAW" >> "$GITHUB_ENV"

      - name: Generate Enabled Modules
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p lib/app/modules/generated
          SYSTEMS_RAW="${SYSTEMS_RAW:-}"
          echo "Generating enabled_modules.dart for systems: '$SYSTEMS_RAW'"

          IFS=',' read -ra RAW_ADDR <<< "$SYSTEMS_RAW"
          declare -A SEEN
          ADDR=()

          for i in "${RAW_ADDR[@]}"; do
            CLEAN_KEY="$(echo "$i" | xargs | tr '[:upper:]' '[:lower:]')"
            if [ -z "$CLEAN_KEY" ]; then
              echo "❌ Error: Empty system key detected (double comma or trailing comma)."
              echo "✅ Example valid input: strategy,ats,project_management"
              exit 1
            fi
            if [[ -n "${SEEN[$CLEAN_KEY]+x}" ]]; then
              echo "❌ Error: Duplicate system key found: '$CLEAN_KEY'"
              exit 1
            fi
            SEEN[$CLEAN_KEY]=1
            ADDR+=("$CLEAN_KEY")
          done

          if [ "${#ADDR[@]}" -eq 0 ]; then
            echo "❌ Error: systems input is empty. Valid keys: project_management, ats, strategy, pms."
            exit 1
          fi

          OUT_FILE="lib/app/modules/generated/enabled_modules.dart"
          echo "import 'package:core_system/core/modules/system_module.dart';" > "$OUT_FILE"

          for i in "${ADDR[@]}"; do
            case "$i" in
              project_management) echo "import 'package:project_management/core/module/project_management_module.dart';" >> "$OUT_FILE" ;;
              ats) echo "import 'package:ats_system/ats_module.dart';" >> "$OUT_FILE" ;;
              strategy) echo "import 'package:strategy_system/strategy_module.dart';" >> "$OUT_FILE" ;;
              pms) echo "import 'package:pms_system/core/module/pms_module.dart';" >> "$OUT_FILE" ;;
              *) echo "❌ Error: Unknown system key '$i'. Valid keys: project_management, ats, strategy, pms." ; exit 1 ;;
            esac
          done

          {
            echo ""
            echo "/// GENERATED FILE - DO NOT EDIT MANUALLY"
            echo "/// Generated by GitHub Actions from input: systems=\"$SYSTEMS_RAW\""
            echo ""
            echo "List<SystemModule> buildEnabledModules() {"
            echo "  return ["
          } >> "$OUT_FILE"

          for i in "${ADDR[@]}"; do
            case "$i" in
              project_management) echo "    ProjectManagementModule()," >> "$OUT_FILE" ;;
              ats) echo "    AtsModule()," >> "$OUT_FILE" ;;
              strategy) echo "    StrategyModule()," >> "$OUT_FILE" ;;
              pms) echo "    PmsModule()," >> "$OUT_FILE" ;;
            esac
          done

          {
            echo "  ];"
            echo "}"
          } >> "$OUT_FILE"

          echo "✅ Generated $OUT_FILE:"
          sed -n '1,200p' "$OUT_FILE"

      - name: Modularity Enforcement
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking for illegal feature imports in app shell..."
          MATCHES=$(grep -rE "package:(ats_system|project_management|strategy_system|pms_system)" lib --exclude="enabled_modules.dart" || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ Modularity Violation: Direct feature imports found outside generated registry!"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No illegal imports found."

      - name: Check key.properties
        working-directory: android
        shell: bash
        run: |
          set -e
          if [ -f "key.properties" ]; then
            echo "✅ key.properties exists"
          else
            echo "⚠️  key.properties not found - release build may fail if signing is required"
          fi

      # - name: Flutter Analyze
      #   run: flutter analyze

      - name: Flutter Test (selected systems)
        shell: bash
        run: |
          set -euo pipefail

          SYSTEMS_RAW="${SYSTEMS_RAW:-}"
          echo "🧪 Selected systems: '$SYSTEMS_RAW'"

          declare -A DIR_MAP=(
            ["ats"]="ats_system"
            ["project_management"]="project_management"
            ["strategy"]="strategy_system"
            ["pms"]="pms_system"
          )

          IFS=',' read -ra SYSTEMS <<< "$SYSTEMS_RAW"

          for sys in "${SYSTEMS[@]}"; do
            KEY="$(echo "$sys" | xargs | tr '[:upper:]' '[:lower:]')"

            if [ -z "$KEY" ]; then
              echo "❌ Empty system key detected."
              exit 1
            fi

            DIR_NAME="${DIR_MAP[$KEY]:-}"
            if [ -z "$DIR_NAME" ]; then
              echo "❌ Unknown system key: '$KEY'"
              echo "✅ Valid keys: ats, project_management, strategy, pms"
              exit 1
            fi

            DIR="systems/$DIR_NAME"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "➡️  Entering: $DIR"

            if [ ! -d "$DIR" ]; then
              echo "❌ Folder not found: $DIR"
              echo "📂 Available under systems/:"
              ls -la systems || true
              exit 1
            fi

            pushd "$DIR" >/dev/null

            echo "📦 flutter pub get (in $DIR)"
            flutter pub get

            echo "🧪 flutter test (in $DIR)"
            flutter test

            popd >/dev/null
            echo "✅ Done tests for: $KEY"
          done

      # ✅ Speed: --no-pub (pub get already done), no verbose
      - name: Build APK
        id: build_apk
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --no-pub \
            --build-name="${{ github.event.inputs.release_name }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=ACTIVE_SYSTEMS="$SYSTEMS_RAW" \
            --dart-define=ENABLE_PROXY="${{ github.event.inputs.enable_proxy }}"

          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK not found at expected path: $APK_PATH"
            echo "🔎 Listing build/app/outputs/flutter-apk:"
            ls -la build/app/outputs/flutter-apk || true
            echo "🔎 Searching for any APK under build/:"
            find build -maxdepth 6 -name "*.apk" -print || true
            exit 1
          fi

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "✅ APK ready at: $APK_PATH"

      - name: Tree-Shaking Verification
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="${{ steps.build_apk.outputs.apk_path }}"
          EXTRACT_DIR="build/apk_tree_shake_check"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 Verifying Tree-Shaking Effectiveness"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "APK: $APK_PATH"
          echo ""

          rm -rf "$EXTRACT_DIR"
          unzip -q "$APK_PATH" -d "$EXTRACT_DIR"

          if [ -f "$EXTRACT_DIR/lib/arm64-v8a/libapp.so" ]; then
            LIBAPP="$EXTRACT_DIR/lib/arm64-v8a/libapp.so"
            ARCH="arm64-v8a"
          elif [ -f "$EXTRACT_DIR/lib/armeabi-v7a/libapp.so" ]; then
            LIBAPP="$EXTRACT_DIR/lib/armeabi-v7a/libapp.so"
            ARCH="armeabi-v7a"
          else
            echo "❌ Error: libapp.so not found in APK"
            exit 1
          fi

          echo "✅ Found libapp.so at: lib/$ARCH/libapp.so"
          echo ""

          IFS=',' read -ra ENABLED_SYSTEMS <<< "$SYSTEMS_RAW"

          declare -A SYSTEM_PACKAGES=(
            ["ats"]="package:ats_system"
            ["project_management"]="package:project_management"
            ["strategy"]="package:strategy_system"
            ["pms"]="package:pms_system"
          )

          VIOLATIONS=0

          for system in ats project_management strategy pms; do
            PKG="${SYSTEM_PACKAGES[$system]}"
            COUNT=$(strings "$LIBAPP" | grep -c "$PKG" || true)

            SHOULD_BE_ENABLED=false
            for enabled in "${ENABLED_SYSTEMS[@]}"; do
              if [ "$(echo "$enabled" | xargs | tr '[:upper:]' '[:lower:]')" == "$system" ]; then
                SHOULD_BE_ENABLED=true
                break
              fi
            done

            if [ "$SHOULD_BE_ENABLED" = true ]; then
              if [ "$COUNT" -gt 0 ]; then
                echo "✅ ${system^^} (enabled): $COUNT references found"
              else
                echo "❌ ${system^^} (enabled): 0 references found - MISSING!"
                VIOLATIONS=$((VIOLATIONS + 1))
              fi
            else
              if [ "$COUNT" -eq 0 ]; then
                echo "✅ ${system^^} (disabled): 0 references - correctly excluded"
              else
                echo "❌ ${system^^} (disabled): $COUNT references found - LEAK DETECTED!"
                VIOLATIONS=$((VIOLATIONS + 1))
              fi
            fi
          done

          echo ""
          if [ "$VIOLATIONS" -eq 0 ]; then
            echo "✅ PASS: Tree-shaking verification successful"
          else
            echo "❌ FAIL: Tree-shaking verification failed ($VIOLATIONS violation(s))"
            exit 1
          fi

      - name: Setup Ruby (with Bundler cache)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1
          bundler-cache: true

      - name: Distribute via Firebase App Distribution
        working-directory: android
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          ACTIVE_SYSTEMS: ${{ env.SYSTEMS_RAW }}
        run: |
          bundle exec fastlane android distribute_ci \
            apk_path:"${{ github.workspace }}/${{ steps.build_apk.outputs.apk_path }}" \
            release_name:"${{ github.event.inputs.release_name }}" \
            test_email:"${{ github.event.inputs.test_email }}" \
            release_notes:"${{ github.event.inputs.release_notes }}"
