name: Deploy APK to Firebase

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: "Add new tester email (will also send to fixed list)"
        required: false
        default: ""
      systems:
        description: "Comma-separated list of active systems (e.g. strategy,ats,pms)"
        required: true
        default: "strategy,ats,pms"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # IMPORTANT: Most modern Flutter/Android builds in CI require Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.2"
          cache: true

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Create .env file
        run: echo "# Environment variables" > .env

      - name: Debug systems input
        run: echo "🚀 ACTIVE_SYSTEMS='${{ github.event.inputs.systems }}'"

      - name: Configure Gradle memory (helps CI stability)
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2g" >> android/gradle.properties

      - name: Clean and get dependencies
        run: |
          flutter clean
          flutter pub get
          flutter pub deps

      - name: Check Flutter doctor
        run: flutter doctor -v

      - name: Build APK (capture full logs)
        shell: bash
        run: |
          set -o pipefail
          flutter build apk \
            --release \
            --no-shrink \
            --dart-define=ACTIVE_SYSTEMS="${{ github.event.inputs.systems }}" \
            -v 2>&1 | tee build.log

      - name: Upload APK artifact (for download/debug)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build.log

      # This prints the REAL Gradle failure reason when flutter only shows exit code 1
      - name: Gradle stacktrace (only if failed)
        if: failure()
        shell: bash
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace --info --warning-mode all

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: false

      - name: Install Fastlane
        run: gem install fastlane

      - name: Install Bundler
        run: gem install bundler

      - name: Distribute via Firebase App Distribution
        working-directory: android
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          ACTIVE_SYSTEMS: ${{ github.event.inputs.systems }}
        run: |
          fastlane android distribute_ci test_email:${{ github.event.inputs.test_email }}
