name: Deploy APK to Firebase

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Add new tester email (will also send to fixed list)'
        required: false
        default: 'Enter the client email...'

      systems:
        description: 'Comma-separated list of active systems (e.g. strategy,ats,pms)'
        required: true
        default: 'strategy,ats,pms'

      release_name:
        description: 'Release name (e.g. v1.2.3-clientX)'
        required: true

      release_notes:
        description: 'Release notes for Firebase tester emails'
        required: true
        default: 'Automated CI release'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create .env file
        run: echo "# Environment variables" > .env

      - name: Install Dependencies
        run: flutter pub get

      - name: Set Gradle Heap Size
        run: echo "org.gradle.jvmargs=-Xmx4g" >> android/gradle.properties

      - name: Debug systems input
        run: echo "🚀 ACTIVE_SYSTEMS='${{ github.event.inputs.systems }}'"

      - name: Generate Enabled Modules
        run: |
          mkdir -p lib/app/modules/generated
          
          # Read inputs into array, trimming spaces
          IFS=',' read -ra RAW_ADDR <<< "${{ github.event.inputs.systems }}"
          
          # Normalize and check for duplicates
          declare -A SEEN
          ADDR=()
          for i in "${RAW_ADDR[@]}"; do
            # Trim whitespace and convert to lowercase
            CLEAN_KEY=$(echo "$i" | xargs | tr '[:upper:]' '[:lower:]')
            
            if [ -z "$CLEAN_KEY" ]; then
              echo "❌ Error: Empty system key detected (double comma or trailing comma)."
              echo "✅ Example valid input: strategy,ats,pms"
              exit 1
            fi
            
            if [ -n "$SEEN[$CLEAN_KEY]" ]; then
              echo "❌ Error: Duplicate system key found: '$CLEAN_KEY'"
              exit 1
            fi
            SEEN[$CLEAN_KEY]=1
            ADDR+=("$CLEAN_KEY")
          done
          
          if [ "${#ADDR[@]}" -eq 0 ]; then
            echo "❌ Error: systems input is empty. Valid keys: pms, ats, strategy."
            exit 1
          fi
          
          # Start generating file
          echo "import 'package:core_system/core/modules/system_module.dart';" > lib/app/modules/generated/enabled_modules.dart
          
          for i in "${ADDR[@]}"; do
            case $i in
              pms)
                echo "import 'package:pms_system/core/module/pms_module.dart';" >> lib/app/modules/generated/enabled_modules.dart
                ;;
              ats)
                echo "import 'package:ats_system/ats_module.dart';" >> lib/app/modules/generated/enabled_modules.dart
                ;;
              strategy)
                echo "import 'package:strategy_system/strategy_module.dart';" >> lib/app/modules/generated/enabled_modules.dart
                ;;
              *)
                echo "❌ Error: Unknown system key '$i'. Valid keys: pms, ats, strategy."
                exit 1
                ;;
            esac
          done
          
          echo "" >> lib/app/modules/generated/enabled_modules.dart
          echo "List<SystemModule> buildEnabledModules() {" >> lib/app/modules/generated/enabled_modules.dart
          echo "  return [" >> lib/app/modules/generated/enabled_modules.dart
          
          for i in "${ADDR[@]}"; do
            case $i in
              pms) echo "    PmsModule()," >> lib/app/modules/generated/enabled_modules.dart ;;
              ats) echo "    AtsModule()," >> lib/app/modules/generated/enabled_modules.dart ;;
              strategy) echo "    StrategyModule()," >> lib/app/modules/generated/enabled_modules.dart ;;
            esac
          done
          
          echo "  ];" >> lib/app/modules/generated/enabled_modules.dart
          echo "}" >> lib/app/modules/generated/enabled_modules.dart
          
          echo "✅ Generated lib/app/modules/generated/enabled_modules.dart:"
          cat lib/app/modules/generated/enabled_modules.dart

      - name: Modularity Enforcement
        run: |
          echo "Checking for illegal feature imports in app shell..."
          set -e
          # Grep for feature imports in lib/, excluding the generated FILE only.
          # If matches found, it means modularity is violated.
          MATCHES=$(grep -rE "package:(ats|pms|strategy)_system" lib --exclude="lib/app/modules/generated/enabled_modules.dart" || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ Modularity Violation: Direct feature imports found outside generated registry!"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No illegal imports found."

      - name: Check key.properties
        working-directory: android
        run: |
          if [ -f "key.properties" ]; then
            echo "✅ key.properties exists"
          else
            echo "⚠️  key.properties not found - release build may fail if signing is required"
          fi

      - name: Clean and get dependencies
        run: |
          flutter clean
          flutter pub get
          flutter pub deps

      - name: Flutter Analyze
        run: flutter analyze

      - name: Check Flutter doctor
        run: flutter doctor -v

      - name: Build APK
        id: build_apk
        run: |
          set -e
          flutter build apk \
            --release \
            --dart-define=ACTIVE_SYSTEMS="${{ github.event.inputs.systems }}" \
            --verbose 2>&1 | tee build.log || (echo "Build failed, checking logs..." && cat build.log && exit 1)
        continue-on-error: false

      - name: Capture build logs (if build fails)
        if: failure()
        run: |
          echo "=== Build log (last 200 lines) ==="
          if [ -f build.log ]; then
            tail -200 build.log
          else
            echo "Build log file not found"
          fi
          echo ""
          echo "=== Searching for errors in build log ==="
          if [ -f build.log ]; then
            grep -i -A 20 "error\|exception\|failure\|failed" build.log | head -100 || echo "No obvious errors found in grep"
          fi

      - name: Capture Gradle errors (if build fails)
        if: failure()
        working-directory: android
        run: |
          echo "=== Running Gradle with full stacktrace ==="
          ./gradlew assembleRelease --stacktrace --info 2>&1 | tee gradle-error.log || true
          echo ""
          echo "=== Error summary from Gradle ==="
          grep -i -B 5 -A 30 "FAILURE\|> Task.*FAILED\|Exception\|Error\|Caused by" gradle-error.log | head -150 || echo "No obvious errors in Gradle output"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1

      - name: Install Fastlane
        run: gem install fastlane

      - name: Install Bundler
        run: gem install bundler

      # - name: Install Fastlane plugins
      #   working-directory: android
      #   run: bundle exec fastlane install_plugins

      - name: Distribute via Firebase App Distribution
        working-directory: android
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          ACTIVE_SYSTEMS: ${{ github.event.inputs.systems }}
        run: |
          fastlane android distribute_ci \
            test_email:"${{ github.event.inputs.test_email }}" \
            release_name:"${{ github.event.inputs.release_name }}" \
            release_notes:"${{ github.event.inputs.release_notes }}"
