name: Deploy APK to Firebase

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Add new tester email (will also send to fixed list)'
        required: false
        default: 'Enter the client email...'

      systems:
        description: 'Comma-separated list of active systems (e.g. strategy,ats,pms)'
        required: true
        default: 'strategy,ats,pms'

      release_name:
        description: 'Release name (e.g. v1.2.3-clientX)'
        required: true

      release_notes:
        description: 'Release notes for Firebase tester emails'
        required: true
        default: 'Automated CI release'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create .env file
        run: echo "# Environment variables" > .env

      - name: Install Dependencies
        run: flutter pub get

      - name: Set Gradle Heap Size
        run: echo "org.gradle.jvmargs=-Xmx4g" >> android/gradle.properties

      - name: Debug systems input
        run: echo "🚀 ACTIVE_SYSTEMS='${{ github.event.inputs.systems }}'"

      - name: Generate Enabled Modules
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p lib/app/modules/generated

          SYSTEMS_RAW="${{ github.event.inputs.systems }}"
          echo "Generating enabled_modules.dart for systems: '$SYSTEMS_RAW'"

          # Read inputs into array
          IFS=',' read -ra RAW_ADDR <<< "$SYSTEMS_RAW"

          # Normalize and check for empties/duplicates
          declare -A SEEN
          ADDR=()

          for i in "${RAW_ADDR[@]}"; do
            # Trim whitespace and convert to lowercase
            CLEAN_KEY="$(echo "$i" | xargs | tr '[:upper:]' '[:lower:]')"

            # Empty key check (double comma or trailing comma)
            if [ -z "$CLEAN_KEY" ]; then
              echo "❌ Error: Empty system key detected (double comma or trailing comma)."
              echo "✅ Example valid input: strategy,ats,pms"
              exit 1
            fi

            # Duplicate check (FIXED for associative array)
            if [[ -n "${SEEN[$CLEAN_KEY]+x}" ]]; then
              echo "❌ Error: Duplicate system key found: '$CLEAN_KEY'"
              exit 1
            fi

            SEEN[$CLEAN_KEY]=1
            ADDR+=("$CLEAN_KEY")
          done

          # Empty list check
          if [ "${#ADDR[@]}" -eq 0 ]; then
            echo "❌ Error: systems input is empty. Valid keys: pms, ats, strategy."
            exit 1
          fi

          OUT_FILE="lib/app/modules/generated/enabled_modules.dart"

          # Start generating file (overwrite)
          echo "import 'package:core_system/core/modules/system_module.dart';" > "$OUT_FILE"

          # Imports
          for i in "${ADDR[@]}"; do
            case "$i" in
              pms)
                echo "import 'package:pms_system/core/module/pms_module.dart';" >> "$OUT_FILE"
                ;;
              ats)
                echo "import 'package:ats_system/ats_module.dart';" >> "$OUT_FILE"
                ;;
              strategy)
                echo "import 'package:strategy_system/strategy_module.dart';" >> "$OUT_FILE"
                ;;
              *)
                echo "❌ Error: Unknown system key '$i'. Valid keys: pms, ats, strategy."
                exit 1
                ;;
            esac
          done

          # Body
          {
            echo ""
            echo "/// GENERATED FILE - DO NOT EDIT MANUALLY"
            echo "/// Generated by GitHub Actions from input: systems=\"$SYSTEMS_RAW\""
            echo ""
            echo "List<SystemModule> buildEnabledModules() {"
            echo "  return ["
          } >> "$OUT_FILE"

          for i in "${ADDR[@]}"; do
            case "$i" in
              pms) echo "    PmsModule()," >> "$OUT_FILE" ;;
              ats) echo "    AtsModule()," >> "$OUT_FILE" ;;
              strategy) echo "    StrategyModule()," >> "$OUT_FILE" ;;
            esac
          done

          {
            echo "  ];"
            echo "}"
          } >> "$OUT_FILE"

          echo "✅ Generated $OUT_FILE:"
          sed -n '1,200p' "$OUT_FILE"

      - name: Modularity Enforcement
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking for illegal feature imports in app shell..."

          GENERATED_FILE="lib/app/modules/generated/enabled_modules.dart"

          MATCHES=$(grep -rE "package:(ats|pms|strategy)_system" lib \
            --exclude="$GENERATED_FILE" || true)

          if [ -n "$MATCHES" ]; then
            echo "❌ Modularity Violation: Direct feature imports found outside generated registry!"
            echo "$MATCHES"
            exit 1
          fi

          echo "✅ No illegal imports found."

      - name: Check key.properties
        working-directory: android
        shell: bash
        run: |
          set -e
          if [ -f "key.properties" ]; then
            echo "✅ key.properties exists"
          else
            echo "⚠️  key.properties not found - release build may fail if signing is required"
          fi

      - name: Clean and get dependencies
        shell: bash
        run: |
          set -e
          flutter clean
          flutter pub get
          flutter pub deps

      - name: Flutter Analyze
        run: flutter analyze

      - name: Check Flutter doctor
        run: flutter doctor -v

      - name: Build APK
        id: build_apk
        shell: bash
        run: |
          set -e
          flutter build apk \
            --release \
            --dart-define=ACTIVE_SYSTEMS="${{ github.event.inputs.systems }}" \
            --verbose 2>&1 | tee build.log || (echo "Build failed, checking logs..." && cat build.log && exit 1)
        continue-on-error: false

      - name: Capture build logs (if build fails)
        if: failure()
        shell: bash
        run: |
          echo "=== Build log (last 200 lines) ==="
          if [ -f build.log ]; then
            tail -200 build.log
          else
            echo "Build log file not found"
          fi
          echo ""
          echo "=== Searching for errors in build log ==="
          if [ -f build.log ]; then
            grep -i -A 20 "error\|exception\|failure\|failed" build.log | head -100 || echo "No obvious errors found in grep"
          fi

      - name: Capture Gradle errors (if build fails)
        if: failure()
        working-directory: android
        shell: bash
        run: |
          echo "=== Running Gradle with full stacktrace ==="
          ./gradlew assembleRelease --stacktrace --info 2>&1 | tee gradle-error.log || true
          echo ""
          echo "=== Error summary from Gradle ==="
          grep -i -B 5 -A 30 "FAILURE\|> Task.*FAILED\|Exception\|Error\|Caused by" gradle-error.log | head -150 || echo "No obvious errors in Gradle output"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1

      - name: Install Fastlane
        run: gem install fastlane

      - name: Install Bundler
        run: gem install bundler

      - name: Distribute via Firebase App Distribution
        working-directory: android
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          ACTIVE_SYSTEMS: ${{ github.event.inputs.systems }}
        run: |
          fastlane android distribute_ci \
            test_email:"${{ github.event.inputs.test_email }}" \
            release_name:"${{ github.event.inputs.release_name }}" \
            release_notes:"${{ github.event.inputs.release_notes }}"
