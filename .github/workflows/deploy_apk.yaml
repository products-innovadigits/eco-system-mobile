name: Deploy APK to Firebase

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Add new tester email (will also send to fixed list)'
        required: false
        default: 'Enter the client email...'
      systems:
        description: 'Comma-separated list of active systems (e.g. strategy,ats,pms)'
        required: true
        default: 'strategy,ats,pms'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'

      - name: Create .env file
        run: echo "# Environment variables" > .env

      - name: Install Dependencies
        run: flutter pub get

      - name: Set Gradle Heap Size
        run: echo "org.gradle.jvmargs=-Xmx4g" >> android/gradle.properties

      - name: Debug systems input
        run: echo "🚀 ACTIVE_SYSTEMS='${{ github.event.inputs.systems }}'"
      
      - name: Check key.properties
        working-directory: android
        run: |
          if [ -f "key.properties" ]; then
            echo "✅ key.properties exists"
          else
            echo "⚠️  key.properties not found - release build may fail if signing is required"
          fi

      - name: Clean and get dependencies
        run: |
          flutter clean
          flutter pub get
          flutter pub deps

      - name: Check Flutter doctor
        run: flutter doctor -v

      - name: Build APK
        run: |
          flutter build apk \
            --release \
            --no-shrink \
            --dart-define=ACTIVE_SYSTEMS="${{ github.event.inputs.systems }}" \
            --verbose
        continue-on-error: false
      
      - name: Capture Gradle errors (if build fails)
        if: failure()
        working-directory: android
        run: |
          echo "=== Full Gradle Error Log ==="
          ./gradlew assembleRelease --stacktrace --info 2>&1 | tail -100 || true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1

      - name: Install Fastlane
        run: gem install fastlane

      - name: Install Bundler
        run: gem install bundler

      # - name: Install Fastlane plugins
      #   working-directory: android
      #   run: bundle exec fastlane install_plugins

      - name: Distribute via Firebase App Distribution
        working-directory: android
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          ACTIVE_SYSTEMS: ${{ github.event.inputs.systems }}
        run: |
          fastlane android distribute_ci test_email:${{ github.event.inputs.test_email }}
